spring.application.name=epq-bakend

# Configuración de MySQL
# IMPORTANTE: cada persona debe crear src/main/resources/application-local.properties
# con SU usuario y SU contraseña de MySQL. Ese archivo NO se sube a git (esta ignorado).
# Si no lo creas, la app no podra conectarse a la base de datos.
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=jdbc:mysql://localhost:3306/EPQ
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA
# El esquema de la base `epq` es la fuente de verdad (ver db/schema.sql).
# NO usar `update`: Hibernate convierte los ENUM de MySQL en varchar(255) y
# elimina NOT NULL / DEFAULT / tamanos declarados (ocurrio el 16/11/2026).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración JWT
app.jwt.secret=K9mP2xL7qR8vN4zA1sD6fG3hJ0kW5eT9Y2uI7oP4
app.jwt.expiracion-horas=8
